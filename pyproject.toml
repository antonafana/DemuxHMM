[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demuxHMM"
version = "0.2.0"
description = "A Hidden Markov Model based demultiplexing method for breeding-enabled scRNA-seq data and other omics."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Anton Afanassiev"}]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]


dependencies = [
    "numpy",
    "numba<0.66.0",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
paper = [
    "pandas",
    "scikit-learn",
    "pysam",
    "anndata",
    "vireoSNP",
    "pandarallel",
    "pyvcf3",
    "seaborn",
    "wot"
]

[tool.setuptools]
packages = ["demuxHMM"]
